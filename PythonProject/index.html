<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>IST Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
    color: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    touch-action: manipulation;
  }
  body.dark { background: #000; color: #fff; }

  /* Rotating container; size/position set by JS */
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    -webkit-transform-origin: 50% 50%;
    transform-origin: 50% 50%;
  }

  /* ---- Clock (top area) ---- */
  #clock {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
  }
  #time {
    font-weight: bold;
    line-height: 1;
    white-space: nowrap;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  #ampm {
    font-size: 0.32em;
    margin-left: 0.15em;
    letter-spacing: 0;
  }
  #date {
    font-weight: bold;
    margin-top: 0.35em;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  /* ---- Calendar (bottom area) ---- */
  #cal {
    position: absolute;
    left: 0;
    right: 0;
    text-align: center;
    white-space: nowrap;
  }
  .month {
    display: inline-block;
    vertical-align: top;
    width: 31%;
    margin: 0 1%;
    white-space: normal;
  }
  .mtitle {
    font-weight: bold;
    padding-bottom: 0.3em;
    margin-bottom: 0.2em;
    border-bottom: 1px solid #000;
    letter-spacing: 0.05em;
  }
  .month.cur .mtitle { text-decoration: underline; }
  body.dark .mtitle { border-bottom-color: #fff; }

  .month table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .month th, .month td {
    text-align: center;
    padding: 0.18em 0;
    line-height: 1.15;
    border: 1px solid #000;
  }
  body.dark .month th, body.dark .month td { border-color: #fff; }
  .month th { font-weight: bold; }
  .month td.today {
    background: #000;
    color: #fff;
    font-weight: bold;
  }
  body.dark .month td.today {
    background: #fff;
    color: #000;
  }

  /* ---- Tiny corner controls ---- */
  #controls {
    position: absolute;
    bottom: 6px;
    left: 6px;
    z-index: 2;
  }
  .btn {
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
    padding: 6px;
    width: 42px;
    height: 42px;
    font-family: inherit;
    font-size: 0;
    line-height: 0;
    background: #fff;
    color: #000;
    border: 2px solid #000;
    border-radius: 3px;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  body.dark .btn {
    background: #000;
    color: #fff;
    border-color: #fff;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="controls">
    <button type="button" class="btn" id="themeBtn" title="Dark / Bright" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" width="26" height="26">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
      </svg>
    </button>
    <button type="button" class="btn" id="rotateBtn" title="Rotate" aria-label="Rotate">
      <svg viewBox="0 0 24 24" width="26" height="26">
        <path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M20.5 3.5v5.5h-5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="clock">
    <div id="time"><span id="hms">--:--:--</span><span id="ampm">--</span></div>
    <div id="date">&nbsp;</div>
  </div>
  <div id="cal"></div>
</div>

<script>
(function () {
  // ES5 only: Kindle's browser engine is old.
  var IST_OFFSET_MS = 330 * 60 * 1000; // +5:30, IST has no DST
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  var WEEK_HDR = ["M", "T", "W", "T", "F", "S", "S"]; // Monday first

  var stage = document.getElementById("stage");
  var clockEl = document.getElementById("clock");
  var timeEl = document.getElementById("time");
  var hmsEl = document.getElementById("hms");
  var ampmEl = document.getElementById("ampm");
  var dateEl = document.getElementById("date");
  var calEl = document.getElementById("cal");
  var rotateBtn = document.getElementById("rotateBtn");
  var themeBtn = document.getElementById("themeBtn");

  var state = { rot: 0, dark: false };
  var lastDate = "";

  // ---- Persistence: saved three ways, because the Kindle browser can drop any one of them ----
  //  1. localStorage   2. cookie (10 years)   3. URL hash, e.g. #r90-d1 (survives in bookmarks)
  // On load the first valid source wins: URL hash, then localStorage, then cookie.

  function parseSetting(str) {
    // format "r<angle>-d<0|1>"
    if (!str) { return null; }
    var m = /r(0|90|180|270)-d([01])/.exec(str);
    return m ? { rot: parseInt(m[1], 10), dark: m[2] === "1" } : null;
  }

  function settingStr() {
    return "r" + state.rot + "-d" + (state.dark ? "1" : "0");
  }

  function readCookie() {
    var m = /(?:^|;\s*)clk=([^;]+)/.exec(document.cookie || "");
    return m ? decodeURIComponent(m[1]) : null;
  }

  function readStorage() {
    try { return window.localStorage.getItem("clk"); } catch (e) { return null; }
  }

  function load() {
    var s = parseSetting(window.location.hash) ||
            parseSetting(readStorage()) ||
            parseSetting(readCookie());
    if (s) { state.rot = s.rot; state.dark = s.dark; }
  }

  function save() {
    var v = settingStr();

    try { window.localStorage.setItem("clk", v); } catch (e) { /* ignore */ }

    try {
      var exp = new Date(new Date().getTime() + 3650 * 86400000).toUTCString();
      document.cookie = "clk=" + encodeURIComponent(v) + "; expires=" + exp +
                        "; max-age=315360000; path=/; SameSite=Lax";
    } catch (e) { /* ignore */ }

    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", "#" + v);
      } else {
        window.location.replace("#" + v);
      }
    } catch (e) { /* ignore */ }
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // Build one month table. y/m may be out of range (e.g. m = -1); Date.UTC normalises it.
  function monthHTML(y, m, todayY, todayM, todayD) {
    var first = new Date(Date.UTC(y, m, 1));
    var yy = first.getUTCFullYear();
    var mm = first.getUTCMonth();
    var daysIn = new Date(Date.UTC(yy, mm + 1, 0)).getUTCDate();
    var lead = (first.getUTCDay() + 6) % 7; // Monday = 0
    var isCur = (yy === todayY && mm === todayM);

    var h = '<div class="month' + (isCur ? ' cur' : '') + '">';
    h += '<div class="mtitle">' + MONTHS[mm] + ' ' + yy + '</div>';
    h += '<table><tr>';
    for (var i = 0; i < 7; i++) { h += '<th>' + WEEK_HDR[i] + '</th>'; }
    h += '</tr>';

    var day = 1;
    for (var row = 0; row < 6; row++) { // always 6 rows so all three months line up
      h += '<tr>';
      for (var col = 0; col < 7; col++) {
        var cell = row * 7 + col;
        if (cell < lead || day > daysIn) {
          h += '<td>&nbsp;</td>';
        } else {
          var cls = (isCur && day === todayD) ? ' class="today"' : '';
          h += '<td' + cls + '>' + day + '</td>';
          day++;
        }
      }
      h += '</tr>';
    }
    h += '</table></div>';
    return h;
  }

  function renderCalendar(y, m, d) {
    calEl.innerHTML =
      monthHTML(y, m - 1, y, m, d) +
      monthHTML(y, m, y, m, d) +
      monthHTML(y, m + 1, y, m, d);
  }

  function tick() {
    var now = new Date();
    var ist = new Date(now.getTime() + IST_OFFSET_MS);

    var h24 = ist.getUTCHours();
    var h12 = h24 % 12;
    if (h12 === 0) { h12 = 12; }

    hmsEl.innerHTML = pad(h12) + ":" + pad(ist.getUTCMinutes()) + ":" + pad(ist.getUTCSeconds());
    ampmEl.innerHTML = h24 < 12 ? "AM" : "PM";

    var y = ist.getUTCFullYear(), m = ist.getUTCMonth(), dd = ist.getUTCDate();
    var d = DAYS[ist.getUTCDay()] + " " + pad(dd) + "-" + MONTHS[m] + "-" + y;
    if (d !== lastDate) {           // date text + calendar only redraw once a day
      dateEl.innerHTML = d;
      renderCalendar(y, m, dd);
      lastDate = d;
    }

    // Align next update to the start of the next second
    var wait = 1000 - (new Date().getTime() % 1000) + 15;
    setTimeout(tick, wait);
  }

  function setTransform(el, value) {
    el.style.webkitTransform = value;
    el.style.transform = value;
  }

  function layout() {
    var W = window.innerWidth || document.documentElement.clientWidth;
    var H = window.innerHeight || document.documentElement.clientHeight;
    var sideways = (state.rot % 180) !== 0;
    var sw = sideways ? H : W;
    var sh = sideways ? W : H;

    stage.style.width = sw + "px";
    stage.style.height = sh + "px";
    stage.style.left = Math.round((W - sw) / 2) + "px";
    stage.style.top = Math.round((H - sh) / 2) + "px";
    setTransform(stage, "rotate(" + state.rot + "deg)");

    // Split: clock gets the top ~42%, calendar the rest
    var clockH = sh * 0.42;
    var calTop = clockH;
    var calH = sh - calTop - 62; // keep a strip at the bottom for the icon buttons

    // Clock fonts: time + date (~1.6 lines of time height total)
    var t = Math.floor(Math.min(sw / 5.4, clockH / 1.75));
    var df = Math.max(14, Math.floor(Math.min(t * 0.26, sw / 13)));
    timeEl.style.fontSize = t + "px";
    dateEl.style.fontSize = df + "px";
    var blockH = t + df * 1.5;
    clockEl.style.top = Math.max(16, Math.round((clockH - blockH) / 2) + 6) + "px";

    // Calendar font: 7 cols per ~31% width, 8 lines (title + header + 6 weeks)
    var colW = (sw * 0.31) / 7;
    var cf = Math.floor(Math.min(colW / 1.35, calH / 12.5));
    if (cf < 9) { cf = 9; }
    calEl.style.fontSize = cf + "px";
    calEl.style.top = Math.round(calTop + Math.max(0, (calH - cf * 12) / 2)) + "px";
  }

  function applyTheme() {
    document.body.className = state.dark ? "dark" : "";
    themeBtn.title = state.dark ? "Bright" : "Dark";
  }

  rotateBtn.onclick = function () {
    state.rot = (state.rot + 90) % 360;
    layout();
    save();
  };

  themeBtn.onclick = function () {
    state.dark = !state.dark;
    applyTheme();
    save();
  };

  window.onhashchange = function () {
    var s = parseSetting(window.location.hash);
    if (s && (s.rot !== state.rot || s.dark !== state.dark)) {
      state.rot = s.rot; state.dark = s.dark;
      applyTheme(); layout(); save();
    }
  };

  window.onresize = layout;
  window.onorientationchange = function () { setTimeout(layout, 300); };

  load();
  save();          // sync all three stores (and the URL) with what was loaded
  applyTheme();
  layout();
  tick();
})();
</script>
</body>
</html>
